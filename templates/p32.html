    <div id="djk-stuff">

    </div>
    <br>

    <button onclick="showCentralityData()">Show centrality measures</button>
    </div>
    <br>

    <div id="bfs-stuff">
    <button onclick="showBFSData()">Show BFS stuff</button>
    </div>
    <br>

</body>

<script>


let djkData = {{ djk|tojson }};
let bfsData = {{ bfs|tojson }};
let centralityData = {{ centrality|tojson }};

console.log(djkData);
console.log(bfsData);
console.log(centralityData);

function sendToPython() {

    // going thorugh all the divs 
     let allData = {};

    document.querySelectorAll(".vertex").forEach(node => {
        allData[node.id] = Number(node.dataset.value);
    });

    fetch("/p32", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(allData)
    })
    .then(response => response.json())
    .then(data => {
        djkData = data.djk;
        bfsData = data.bfs;
        centralityData = data.centrality;
    });
}

function updateValue(id, change)
{
    // some weird dataset stuff, but it works
    let node = document.getElementById(id);
    let currentValue = Number(node.dataset.value);
    let newValue = currentValue + change;

    newValue = Math.max(10, Math.min(100, newValue));
    node.dataset.value = newValue;

    let name = node.querySelector("p").textContent.split(":")[0]; // seperating name and data value
    node.querySelector("p").textContent = name + ": " + newValue;

    console.log(node.dataset.value);

    sendToPython()
}


function showDJKData() {
    var x = document.getElementById("djk-stuff")
    var p = document.createElement("p")
    p.textContent = JSON.stringify(djkData)

    x.appendChild(p)
}

function showCentralityData() {
    var x = document.getElementById("centrality-stuff")
    var p = document.createElement("p")
    p.textContent = JSON.stringify(centralityData)

    x.appendChild(p)
}
function showBFSData() {
    var x = document.getElementById("bfs-stuff")
    var p = document.createElement("p")
    p.textContent = JSON.stringify(bfsData)

    x.appendChild(p)
}
</script>

</html>
